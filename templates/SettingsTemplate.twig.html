<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="{{ asset('img/favicon.png') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ asset('css/styles.css') }}">

    <script type="module" src="{{ asset('js/functionalScripts/burguerMenu.js') }}"></script>
    <script type="module" src="{{ asset('js/api/settingsUpdater.js') }}"></script>

    <title>Settings - SMC</title>
</head>

<body>
    <header class="header">
        {% include 'partials/NavigationBar.twig.html' %}
    </header>
    
    <main class="content">
        <div class="form-container">
            <h1 class="page-title">Modify macro-nutrient intake goals</h1>

            <form id="macroGoalsForm">
                <div class="form-group">
                    <label for="calories">New calories goal</label>
                    <input type="number" id="calories" name="calories" class="form-input">
                </div>

                <div class="form-group">
                    <label for="protein">New protein goal</label>
                    <input type="number" id="protein" name="protein" class="form-input">
                </div>

                <div class="form-group">
                    <label for="carbs">New carbs goal</label>
                    <input type="number" id="carbs" name="carbs" class="form-input">
                </div>

                <div class="form-group">
                    <label for="fats">New fats goal</label>
                    <input type="number" id="fats" name="fats" class="form-input">
                </div>

                <div class="form-group">
                    <label for="fiber">New fiber goal</label>
                    <input type="number" id="fiber" name="fiber" class="form-input">
                </div>

                <button type="submit" class="btn-submit">Modify</button>
            </form>
        </div>
    </main>
</body>

</html>
