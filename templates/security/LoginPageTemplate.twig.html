<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ asset('img/favicon.png') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ asset('css/styles.css') }}">
    <title>Login - SMC</title>
</head>

<body>
    <div class="content">
        <div class="form-container">
            <h1 class="page-title">Login to continue</h1>

            {% if error %}
            <div class="alert alert-danger">{{ error.messageKey|trans(error.messageData, 'security') }}</div>
            {% endif %}

            {% if app.user %}
            <div class="form-group">
                <p>You are logged in as {{ app.user.userIdentifier }}.</p>
                <p><a href="{{ path('app_logout') }}" style="color: skyblue">Logout</a> or go back to <a
                        href="{{ path('home') }}" style="color: skyblue">home</a>.</p>
            </div>
            {% endif %}

            <form method="post" id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" name="username" id="username" required autofocus class="form-input">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" required class="form-input">
                </div>

                <button type="submit" class="btn-submit" id="loginButton">Sign in</button>
                <div id="loginError" class="error-message" style="display:none; color:red; margin-top:10px;"></div>
            </form>

            <p>Don't have an account? Register <a href="{{ path('register_form') }}" style="color: skyblue">here</a>!</p>
        </div>
    </div>
    <script type="module" src="{{ asset('js/security/login.js') }}"></script>
</body>

</html>
